name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # only deploy when CI (tests) passed on main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A deploy is only attempted when the repo has a *valid* API token.
      # Missing or expired token => the job stays green and skips, never red.
      - name: Check Cloudflare credentials
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set — skipping deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" = "200" ]; then
            echo "Token is valid — deploying."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Token rejected (HTTP $status) — skipping deploy. Create a scoped API token"
            echo "(Edit Cloudflare Workers template) and set it as CLOUDFLARE_API_TOKEN."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.deployed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the production site
        run: |
          sleep 5
          ok=1
          check() {  # name url expected
            code=$(curl -s -o /dev/null -w '%{http_code}' "$2")
            echo "$1 -> $code (want $3)"
            [ "$code" = "$3" ] || ok=0
          }
          check "health"     "https://tldb.eapp.workers.dev/api/health" 200
          check "home html"  "https://tldb.eapp.workers.dev/" 200
          check "catalog"    "https://tldb.eapp.workers.dev/api/lectures" 200
          check "meta"       "https://tldb.eapp.workers.dev/api/meta" 200
          check "v1 no key"  "https://tldb.eapp.workers.dev/v1/lectures" 401
          data=$(curl -s "https://tldb.eapp.workers.dev/api/home")
          echo "$data" | grep -q '"stats"' || ok=0
          [ "$ok" = "1" ] && echo "PRODUCTION OK" || { echo "PRODUCTION BROKEN"; exit 1; }
